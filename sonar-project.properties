sonar.projectKey=aosedge_aos_core_lib_cpp
sonar.organization=aosedge

sonar.sources=src/
sonar.exclusions=**/tests/**,\
  **/pkcs11/cryptoki/**,\
  **/crypto/mbedtls/drivers/**,\
  **/crypto/mbedtls/mbedtls_config.h,\
  **/crypto/mbedtls/pkcs11.h

sonar.tests=src/
sonar.test.inclusions=**/tests/**

sonar.coverage.exclusions=**/tests/**

# Ignore cpp:M23_356 (prefer std::vector/std::array over C arrays): main code cannot use
# std containers, and custom Array/StaticArray types have no initializer-list constructors.
#
# Ignore cpp:S6022 (prefer std::byte over other types for byte-oriented memory access): main
# code cannot use std types, uint8_t is used instead throughout.
#
# Ignore cpp:S5008 (avoid void*): flagged pervasively on C callback signatures (thread entry
# points, timer/lambda erasure, PKCS11/OpenSSL/mbedtls dispatch tables) where void* is the only
# option; refactoring every site would add indirection with no real type-safety gain.
#
# Ignore cpp:M23_388 (no global variables): flagged on module-level lookup tables and constants
# (timer/semver/uuid parsing tables, crypto OID tables) that are simplest as file-scope globals;
# no std containers are available to construct them lazily inside a function instead.
#
# Ignore cpp:S5566 (prefer STL algorithms/range-for over raw loops): main code cannot use std
# algorithms.
#
# Ignore cpp:M23_404 (no <ctype.h>/<cwctype> functions): <locale> is a std header unavailable to
# main code; the <ctype.h> functions are the only classification primitives we can use.
#
# Ignore cpp:S5028 (macros should not define constants) in config.hpp/testconfig.hpp files only:
# these headers define AOS_CONFIG_* build-time knobs with #ifndef/#define guards so they can be
# overridden by the build system before this header is included, which constexpr/enum can't do.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:M23_356
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=cpp:S6022
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
sonar.issue.ignore.multicriteria.e4.ruleKey=cpp:M23_388
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*
sonar.issue.ignore.multicriteria.e5.ruleKey=cpp:S5566
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*
sonar.issue.ignore.multicriteria.e6.ruleKey=cpp:M23_404
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*
sonar.issue.ignore.multicriteria.e7.ruleKey=cpp:S5028
sonar.issue.ignore.multicriteria.e7.resourceKey=**/config.hpp
sonar.issue.ignore.multicriteria.e8.ruleKey=cpp:S5028
sonar.issue.ignore.multicriteria.e8.resourceKey=**/testconfig.hpp
sonar.issue.ignore.multicriteria.e9.ruleKey=cpp:S7032
sonar.issue.ignore.multicriteria.e9.resourceKey=**/*

sonar.ws.timeout=600
